<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <!-- Sky -->
  <rect width="400" height="150" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="350" cy="40" r="20" fill="#FFD700"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="40" rx="30" ry="15" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="130" cy="45" rx="25" ry="12" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="70" cy="45" rx="20" ry="10" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Back Mountains (lighter) -->
  <polygon points="50,150 150,60 250,150" fill="#8B7355" opacity="0.6"/>
  <polygon points="200,150 280,80 360,150" fill="#A0826D" opacity="0.6"/>
  
  <!-- Front Mountains (darker) -->
  <polygon points="0,150 100,50 200,150" fill="#6B5D52"/>
  <polygon points="150,150 250,45 350,150" fill="#7A6B61"/>
  <polygon points="300,150 400,70 400,150" fill="#6B5D52"/>
  
  <!-- Snow on peaks -->
  <polygon points="100,50 90,70 110,70" fill="#FFFFFF"/>
  <polygon points="250,45 235,70 265,70" fill="#FFFFFF"/>
  <polygon points="400,70 385,100 400,100" fill="#FFFFFF"/>
  
  <!-- Forest/Trees -->
  <g>
    <!-- Tree 1 -->
    <polygon points="130,130 120,100 140,100" fill="#228B22"/>
    <rect x="128" y="130" width="4" height="20" fill="#8B4513"/>
    
    <!-- Tree 2 -->
    <polygon points="220,120 205,90 235,90" fill="#2E8B57"/>
    <rect x="217" y="120" width="4" height="30" fill="#8B4513"/>
    
    <!-- Tree 3 -->
    <polygon points="320,135 310,110 330,110" fill="#228B22"/>
    <rect x="318" y="135" width="4" height="15" fill="#8B4513"/>
  </g>
  
  <!-- Ground/Base -->
  <rect y="150" width="400" height="100" fill="#8FBC8F"/>
  
  <!-- Path/Trail -->
  <ellipse cx="200" cy="200" rx="30" ry="50" fill="#D2B48C" opacity="0.7"/>
</svg>
