<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <!-- Sky -->
  <rect width="400" height="120" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="350" cy="40" r="30" fill="#FFD700"/>
  
  <!-- Sun rays -->
  <line x1="350" y1="5" x2="350" y2="0" stroke="#FFD700" stroke-width="3"/>
  <line x1="350" y1="75" x2="350" y2="80" stroke="#FFD700" stroke-width="3"/>
  <line x1="385" y1="40" x2="390" y2="40" stroke="#FFD700" stroke-width="3"/>
  <line x1="315" y1="40" x2="310" y2="40" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Ocean -->
  <rect y="120" width="400" height="80" fill="#1E90FF"/>
  
  <!-- Waves -->
  <path d="M 0 120 Q 50 110 100 120 T 200 120 T 300 120 T 400 120" stroke="#00BFFF" stroke-width="2" fill="none"/>
  <path d="M 0 140 Q 50 130 100 140 T 200 140 T 300 140 T 400 140" stroke="#00BFFF" stroke-width="2" fill="none"/>
  
  <!-- Sand/Beach -->
  <rect y="200" width="400" height="50" fill="#F4A460"/>
  
  <!-- Umbrella -->
  <ellipse cx="80" cy="185" rx="25" ry="10" fill="#FF6347"/>
  <line x1="80" y1="195" x2="80" y2="215" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Beach ball -->
  <circle cx="300" cy="195" r="12" fill="#FF6347"/>
  <circle cx="308" cy="187" r="12" fill="#FFD700"/>
  <circle cx="308" cy="203" r="12" fill="#00CED1"/>
  
  <!-- Footprints -->
  <circle cx="150" cy="220" r="3" fill="#D2B48C"/>
  <circle cx="160" cy="220" r="3" fill="#D2B48C"/>
  <circle cx="200" cy="222" r="3" fill="#D2B48C"/>
  <circle cx="210" cy="222" r="3" fill="#D2B48C"/>
</svg>
