<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelVista Tourism</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5" href="index.html">TravelVista</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destinations.html">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="packages.html">Tour Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero-section bg-success text-white text-center py-5">
        <div class="container py-5">
            <h1 class="display-4 fw-bold mb-4">Explore Beautiful Destinations</h1>
            <p class="lead mb-4">Discover amazing places and unforgettable travel experiences around the world</p>
            <a href="destinations.html" class="btn btn-warning btn-lg fw-bold">Start Journey</a>
        </div>
    </section>

    <!-- Booking Inquiry Form Section -->
    <section id="contact" class="booking-section py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8">
                    <div class="border rounded-3 p-4 bg-white shadow-sm">
                        <h2 class="text-center mb-5 fw-bold">TravelVista Booking Inquiry</h2>
                        <form id="bookingForm" novalidate>
                            <!-- Full Name Field -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="e.g. Alex Morgan" required>
                                <div class="error" id="fullNameError"></div>
                            </div>

                            <!-- Email Address Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="example@domain.com" required>
                                <div class="error" id="emailError"></div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                <div class="error" id="passwordError"></div>
                            </div>

                            <!-- Confirm Password Field -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-type password" required>
                                <div class="error" id="confirmPasswordError"></div>
                            </div>

                            <!-- Contact Number Field -->
                            <div class="mb-3">
                                <label for="contactNumber" class="form-label fw-semibold">Contact Number</label>
                                <input type="text" class="form-control" id="contactNumber" placeholder="e.g. 0917-1234567 or 09171234567" required>
                                <div class="error" id="contactNumberError"></div>
                            </div>

                            <!-- Booking Reference ID Field -->
                            <div class="mb-3">
                                <label for="bookingRef" class="form-label fw-semibold">Booking Reference ID</label>
                                <input type="text" class="form-control" id="bookingRef" placeholder="Format: TV-2025" required>
                                <div class="error" id="bookingRefError"></div>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Submit Inquiry</button>
                            <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 TravelVista Tourism. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Form Validation Script -->
    <script src="script.js"></script>
</body>
</html>
